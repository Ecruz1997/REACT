name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Secreto de PRUEBAS para CI. En un despliegue real usar GitHub Secrets, no un valor en claro.
  SESSION_SECRET: ci-secreto-suficientemente-largo-para-pruebas-1234567890

jobs:
  verificar:
    name: Typecheck · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # npm ci respeta el lockfile al pie de la letra. Los scripts de instalación corren
      # para que el módulo nativo (better-sqlite3) baje su binario prebuilt.
      # En un entorno endurecido: `npm ci --ignore-scripts` + allowlist de módulos nativos
      # (ver Sesión 5 · cadena de suministro).
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build de producción
        run: npm run build

  e2e:
    name: E2E (Playwright + SQLite)
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # El navegador de Playwright: en GitHub sí se descarga (a diferencia de un sandbox cerrado).
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      # No hace falta una base externa: better-sqlite3 es en archivo.
      # playwright.config.ts siembra una e2e.db desechable y levanta la app.
      - name: E2E
        run: npm run e2e
      - name: Publicar reporte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
